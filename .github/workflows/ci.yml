name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git diff --exit-code -- dist/

  self-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    concurrency:
      group: self-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: yellow
        uses: ./
        with:
          exclude: dist/**
          thresholds: |
            1:comment
            1000000:comment
      - run: |
          .github/self-test-assert.sh "bite-the-diff 🟡 ${{ steps.yellow.outputs.lines }} lines" neutral skipping "🟡 **${{ steps.yellow.outputs.lines }} lines.** That's a lot of elephant for one bite (threshold: 1)."

      - id: orange
        uses: ./
        with:
          exclude: dist/**
          thresholds: |
            1:comment
            2:comment
      - run: |
          .github/self-test-assert.sh "bite-the-diff 🟠 ${{ steps.orange.outputs.lines }} lines" neutral skipping "🟠 **${{ steps.orange.outputs.lines }} lines.** Bigger than one bite should be (threshold: 2)."

      - id: red
        continue-on-error: true
        uses: ./
        with:
          exclude: dist/**
          thresholds: 1:fail
      - run: test "${{ steps.red.outcome }}" = failure
      - run: .github/self-test-assert.sh "bite-the-diff 🔴 ${{ steps.red.outputs.lines }} lines" failure fail "this check stays red"

      - id: bypassed
        run: |
          jq '.pull_request.labels += [{"name": "self-test-bypass"}]' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/event.json"
          env GITHUB_EVENT_PATH="$RUNNER_TEMP/event.json" INPUT_THRESHOLDS=1:fail INPUT_EXCLUDE='dist/**' \
            INPUT_BYPASS-LABEL=self-test-bypass INPUT_TOKEN="$GH_TOKEN" node dist/index.mjs
      - run: test "${{ steps.bypassed.outputs.level }}" = fail
      - run: .github/self-test-assert.sh "bite-the-diff 🟠 ${{ steps.bypassed.outputs.lines }} lines" neutral skipping "let this one through whole"

      - id: under
        uses: ./
        with:
          exclude: dist/**
          thresholds: 1000000:comment
      - run: test "${{ steps.under.outputs.level }}" = none
      - run: .github/self-test-assert.sh "bite-the-diff ${{ steps.under.outputs.lines }} lines" success pass "Bite-sized again."

  self-test-read-only:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v7
      - id: soft
        uses: ./
        with:
          thresholds: 1:comment
      - run: test "${{ steps.soft.outcome }}" = success && test "${{ steps.soft.outputs.level }}" = comment
      - id: hard
        continue-on-error: true
        uses: ./
        with:
          thresholds: 1:fail
      - run: test "${{ steps.hard.outcome }}" = failure
