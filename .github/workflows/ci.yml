name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: git diff --exit-code -- dist/

  pr-size:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      big-enough: ${{ steps.count.outputs.big-enough }}
    steps:
      - id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files" --jq '.[] | select(.filename | startswith("dist/") | not) | .additions + .deletions' > counts
          awk '{ lines += $1 } END { print "big-enough=" (lines >= 2 && NR >= 2 ? "true" : "false") }' counts >> "$GITHUB_OUTPUT"

  self-test:
    needs: pr-size
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.pr-size.outputs.big-enough == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    concurrency:
      group: self-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7.0.1

      - id: yellow
        uses: ./
        with:
          exclude: dist/**
          thresholds: |
            1:comment
            1000000:comment
      - run: |
          .github/self-test-assert.sh "bite-the-diff 🟡 ${{ steps.yellow.outputs.lines }} lines" neutral skipping "🟡 **${{ steps.yellow.outputs.lines }} lines.** That's a lot of elephant for one bite (threshold: 1)."

      - id: orange
        uses: ./
        with:
          exclude: dist/**
          thresholds: |
            1:comment
            2:comment
      - run: |
          .github/self-test-assert.sh "bite-the-diff 🟠 ${{ steps.orange.outputs.lines }} lines" neutral skipping "🟠 **${{ steps.orange.outputs.lines }} lines.** Bigger than one bite should be (threshold: 2)."

      - id: red
        continue-on-error: true
        uses: ./
        with:
          exclude: dist/**
          thresholds: 1:fail
      - run: test "${{ steps.red.outcome }}" = failure
      - run: .github/self-test-assert.sh "bite-the-diff 🔴 ${{ steps.red.outputs.lines }} lines" failure fail "this check stays red"

      - id: files-only
        uses: ./
        with:
          exclude: dist/**
          thresholds: 1000000:comment
          file-threshold: 1
      - run: test "$(gh pr diff "$PR" --name-only | grep -vc '^dist/')" = "${{ steps.files-only.outputs.files }}"
      - run: test "${{ steps.files-only.outputs.level }}" = comment
      - run: |
          .github/self-test-assert.sh "bite-the-diff 🟡 ${{ steps.files-only.outputs.files }} files" neutral skipping "🟡 **${{ steps.files-only.outputs.files }} files.** A lot of elephant to chew at once (threshold: 1)."

      - id: files-and-lines
        uses: ./
        with:
          exclude: dist/**
          thresholds: 1:comment
          file-threshold: 1
      - run: |
          .github/self-test-assert.sh "bite-the-diff 🟡 ${{ steps.files-and-lines.outputs.lines }} lines, ${{ steps.files-and-lines.outputs.files }} files" neutral skipping "Also ${{ steps.files-and-lines.outputs.files }} files (threshold: 1)."

      - id: bypassed
        run: |
          jq '.pull_request.labels += [{"name": "self-test-bypass"}]' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/event.json"
          env GITHUB_EVENT_PATH="$RUNNER_TEMP/event.json" INPUT_THRESHOLDS=1:fail INPUT_FILE-THRESHOLD=50 INPUT_EXCLUDE='dist/**' \
            INPUT_BYPASS-LABEL=self-test-bypass INPUT_TOKEN="$GH_TOKEN" node dist/index.mjs
      - run: test "${{ steps.bypassed.outputs.level }}" = fail
      - run: .github/self-test-assert.sh "bite-the-diff 🟠 ${{ steps.bypassed.outputs.lines }} lines" neutral skipping "let this one through whole"

      - id: tolerance
        uses: ./
        with:
          exclude: dist/**
          thresholds: ${{ steps.yellow.outputs.lines }}:fail
      - run: test "${{ steps.tolerance.outcome }}" = success && test "${{ steps.tolerance.outputs.level }}" = comment
      - run: .github/self-test-assert.sh "bite-the-diff 🟠 ${{ steps.tolerance.outputs.lines }} lines" neutral skipping "🟠 **${{ steps.tolerance.outputs.lines }} lines.** Almost too much elephant"

      - id: under
        uses: ./
        with:
          exclude: dist/**
          thresholds: 1000000:comment
      - run: test "${{ steps.under.outputs.level }}" = none
      - run: .github/self-test-assert.sh "bite-the-diff ${{ steps.under.outputs.lines }} lines" success pass

  self-test-read-only:
    needs: pr-size
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.pr-size.outputs.big-enough == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v7.0.1
      - id: soft
        uses: ./
        with:
          thresholds: 1:comment
      - run: test "${{ steps.soft.outcome }}" = success && test "${{ steps.soft.outputs.level }}" = comment
      - id: hard
        continue-on-error: true
        uses: ./
        with:
          thresholds: 1:fail
      - run: test "${{ steps.hard.outcome }}" = failure
