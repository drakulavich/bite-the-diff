name: tmp-proof
on: pull_request
jobs:
  proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./
        with:
          exclude: .github/**
          thresholds: ${{ github.run_attempt == '1' && '1:comment' || '1:fail' }}
